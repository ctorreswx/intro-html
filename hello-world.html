<!-- doctype - serves as an indicator for the browser to know which html version and pattern to use -->
<!DOCTYPE html>

<!-- html - a root element of everything that belongs in the html document -->
<!-- lang - specifies the language of the document amd improves accessibility, en stands for english -->
<html lang="en">

<!-- head - contains meta information about the document -->
<head>
    
    <!-- charset - specifies the character encoding for the document, permitting the display of characters from various languages, as well as special symbols and emojis -->
    <meta charset="UTF-8">
    
    
    <!-- viewport - specifies the width and initial scale of the document, allowing it to be responsive and work on different screen sizes -->
    <meta name="viewport" content="width=, initial-scale=1.0">
    
    <!-- title - specifies the title of the document -->
    <title>Hello, World!</title>
</head>

<!-- body - contains the visible content of the document -->
<body>
   Hello, World, this is my first HTML project.
</body>
</html>
